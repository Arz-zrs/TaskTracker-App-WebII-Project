services:
  nginx-web-server:
    image: nginx:stable-alpine
    container_name: nginx-web-server
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - tasktracker-network

  php:
    build:
      context: ./docker/php
    container_name: tasktracker-php
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_NAME=tasktracker
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql
    networks:
      - tasktracker-network

  mysql:
    image: mysql:latest
    container_name: tasktracker-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tasktracker
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - tasktracker-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tasktracker-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql
    networks:
      - tasktracker-network

volumes:
  mysql-data:

networks:
  tasktracker-network:
    driver: bridge